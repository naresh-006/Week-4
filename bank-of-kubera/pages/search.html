<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Search | Bank of Kubera</title>
    <meta
      name="description"
      content="Global search across Bank of Kubera."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell" data-page="search">
      <header class="topbar">
        <a class="brand-home-link" href="../index.html" aria-label="Bank of Kubera home">
          <div class="brand-wrap">
          <div class="brand-mark" aria-label="Bank of Kubera logo">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.14)"/>
              <path d="M20 18h8l10 14V18h8v28h-8L28 32v14h-8V18z" fill="white"/>
              <path d="M32 10c6 0 11 5 11 11s-5 11-11 11-11-5-11-11 5-11 11-11zm0 6.5c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5-2 4.5-4.5-2-4.5-4.5-4.5z" fill="rgba(215,181,109,0.95)"/>
            </svg>
          </div>
          <div>
            <p class="brand-label">Bank of Kubera</p>
          </div>
          </div>
        </a>

        <nav class="topbar-nav" aria-label="Main header navigation">
          <a href="../index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="accounts.html">Accounts</a>
          <a href="help.html">Help</a>
        </nav>

        <div class="header-actions">
          <a href="login.html" class="btn btn-secondary">Sign In</a>
        </div>
      </header>

      <main class="public-page-main">
        <section class="page-banner">
          <p class="eyebrow">Global Search</p>
          <h1>Find your way around banking.</h1>
          <p>Search across accounts, cards, loans, transfers, security, and help.</p>
        </section>

        <section class="page-panel global-search-panel">
          <form id="global-search-form" class="global-search-form" role="search">
            <label for="global-search-input">Search banking</label>
            <div class="global-search-row">
              <input id="global-search-input" type="search" placeholder="Try “security”, “card”, or “transfer”" autocomplete="off" />
              <button type="submit" class="btn btn-primary">Search</button>
              <button id="global-search-clear" type="button" class="btn btn-ghost">Clear</button>
            </div>
          </form>
          <p id="global-search-status" class="help-result-count" aria-live="polite">Enter a topic to search banking.</p>
        </section>

        <section class="page-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow eyebrow-dark">Results</p>
              <h2>Explore by category</h2>
            </div>
          </div>
          <div id="global-search-results" class="global-search-results" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="../js/app.js"></script>
  </body>
</html>
