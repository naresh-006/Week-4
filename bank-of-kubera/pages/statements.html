<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statements | Bank of Kubera</title>
    <meta name="description" content="Account statement view for Bank of Kubera." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell" data-page="statements">
      <header class="topbar">
        <a class="brand-home-link" href="../index.html" aria-label="Bank of Kubera home">
          <div class="brand-wrap">
          <div class="brand-mark" aria-label="Bank of Kubera logo">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.14)"/>
              <path d="M20 18h8l10 14V18h8v28h-8L28 32v14h-8V18z" fill="white"/>
              <path d="M32 10c6 0 11 5 11 11s-5 11-11 11-11-5-11-11 5-11 11-11zm0 6.5c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5-2 4.5-4.5-2-4.5-4.5-4.5z" fill="rgba(215,181,109,0.95)"/>
            </svg>
          </div>
          <div><p class="brand-label">Bank of Kubera</p></div>
          </div>
        </a>
        <nav class="topbar-nav" aria-label="Main header navigation">
          <a href="../index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="accounts.html">Accounts</a>
          <a href="transactions.html">Transactions</a>
          <a href="statements.html">Statements</a>
        </nav>
        <div class="header-actions"><a href="login.html" class="btn btn-secondary">Sign In</a></div>
      </header>

      <main class="public-page-main">
        <section class="page-banner">
          <p class="eyebrow">Statements</p>
          <h1>Your account statement, clearly arranged.</h1>
          <p>Review your statement summary and transaction list.</p>
        </section>

        <section class="page-panel">
          <div class="statement-controls">
            <div class="field-group">
              <label for="statement-account">Account</label>
              <select id="statement-account"></select>
            </div>
            <div class="field-group">
              <label for="statement-period">Statement period</label>
              <select id="statement-period">
                <option value="2026-09">September 2026</option>
                <option value="2026-08">August 2026</option>
              </select>
            </div>
            <button id="statement-download" type="button" class="btn btn-primary">Download Statement</button>
          </div>
          <p id="statement-status" class="form-status" role="status" aria-live="polite"></p>
        </section>

        <section class="statement-summary" aria-label="Statement summary">
          <div class="summary-stat"><span>Opening balance</span><strong id="statement-opening">₹ 0</strong></div>
          <div class="summary-stat"><span>Total credits</span><strong id="statement-credits">₹ 0</strong></div>
          <div class="summary-stat"><span>Total debits</span><strong id="statement-debits">₹ 0</strong></div>
          <div class="summary-stat"><span>Closing balance</span><strong id="statement-closing">₹ 0</strong></div>
        </section>

        <section class="page-panel">
          <div class="panel-header">
            <div><p class="eyebrow eyebrow-dark">Statement activity</p><h2>Transactions</h2></div>
          </div>
          <div id="statement-table" class="transactions-list-wrap" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
