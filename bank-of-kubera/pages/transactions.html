<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction History | Bank of Kubera</title>
    <meta
      name="description"
      content="Transaction history for Bank of Kubera."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell" data-page="transactions">
      <header class="topbar">
        <a class="brand-home-link" href="../index.html" aria-label="Bank of Kubera home">
          <div class="brand-wrap">
          <div class="brand-mark" aria-label="Bank of Kubera logo">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.14)"/>
              <path d="M20 18h8l10 14V18h8v28h-8L28 32v14h-8V18z" fill="white"/>
              <path d="M32 10c6 0 11 5 11 11s-5 11-11 11-11-5-11-11 5-11 11-11zm0 6.5c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5-2 4.5-4.5-2-4.5-4.5-4.5z" fill="rgba(215,181,109,0.95)"/>
            </svg>
          </div>
          <div>
            <p class="brand-label">Bank of Kubera</p>
          </div>
          </div>
        </a>

        <nav class="topbar-nav" aria-label="Main header navigation">
          <a href="../index.html">Home</a>
          <a href="accounts.html">Accounts</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="transactions.html">Transactions</a>
        </nav>

        <div class="header-actions">
          <a href="login.html" class="btn btn-secondary">Sign In</a>
        </div>
      </header>

      <main class="public-page-main">
        <section class="page-banner">
          <p class="eyebrow">Transactions</p>
          <h1>Transaction history</h1>
          <p>Search, filter, and review your transaction entries.</p>
        </section>

        <section class="page-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow eyebrow-dark">Transaction data</p>
              <h2>Filter transaction records</h2>
            </div>
          </div>

          <div class="transaction-controls">
            <div class="field-group">
              <label for="transaction-search">Search description</label>
              <input id="transaction-search" type="search" placeholder="Search transaction" />
            </div>

            <div class="field-group">
              <label for="transaction-account-filter">Account</label>
              <select id="transaction-account-filter">
                <option value="all">All accounts</option>
              </select>
            </div>

            <div class="field-group">
              <label for="transaction-type-filter">Type</label>
              <select id="transaction-type-filter">
                <option value="all">All types</option>
                <option value="Credit">Credit</option>
                <option value="Debit">Debit</option>
              </select>
            </div>

            <div class="field-group">
              <label for="transaction-date-filter">Date</label>
              <input id="transaction-date-filter" type="date" />
            </div>
          </div>

          <div id="transactions-table-wrap" class="transactions-list-wrap"></div>
        </section>
      </main>
    </div>

    <script src="../js/app.js"></script>
  </body>
</html>
